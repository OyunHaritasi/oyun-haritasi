<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Oyun Haritası</title>
<style>
:root{--bg:#07080b;--bg2:#0e1117;--card:#12161e;--blue:#1ea7ff;--blue2:#4cc9ff;--tx:#e9f1fa;--mut:#8a97a8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--tx);font-family:"Segoe UI",Roboto,system-ui,sans-serif;overflow-x:hidden}
#loader{position:fixed;inset:0;z-index:100;background:#050608;display:grid;place-items:center;transition:opacity .8s,visibility .8s}
#loader.off{opacity:0;visibility:hidden}
.ld{width:min(78vw,360px);text-align:center}
.ld b{font-size:13px;letter-spacing:.5em;color:var(--blue2)}
.ld .road{height:46px;position:relative;margin:18px 0;border-bottom:2px solid #1b2230}
.ld .van{position:absolute;bottom:0;left:0;font-size:34px;animation:drive 1.9s cubic-bezier(.5,0,.3,1) forwards;filter:drop-shadow(0 0 12px var(--blue))}
@keyframes drive{to{left:calc(100% - 44px)}}
.bar{height:3px;background:#161b25;border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),#fff);animation:fill 1.9s forwards;box-shadow:0 0 14px var(--blue)}
@keyframes fill{to{width:100%}}
.hero{position:relative;min-height:100svh;overflow:hidden;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:90px 18px 140px;perspective:900px}
.layer{position:absolute;inset:0;pointer-events:none;will-change:transform}
.glow{background:radial-gradient(60% 45% at 50% 38%,rgba(30,167,255,.28),transparent 70%),radial-gradient(40% 30% at 15% 85%,rgba(30,167,255,.14),transparent 70%)}
.grid{background-image:linear-gradient(rgba(30,167,255,.09) 1px,transparent 1px),linear-gradient(90deg,rgba(30,167,255,.09) 1px,transparent 1px);background-size:56px 56px;transform:rotateX(62deg) scale(2.2) translateY(30%);transform-origin:50% 100%;mask-image:linear-gradient(transparent,#000 70%);-webkit-mask-image:linear-gradient(transparent,#000 70%);animation:gridmove 3s linear infinite;inset:30% 0 0}
@keyframes gridmove{to{background-position:0 56px}}
.hero h1{position:relative;font-size:clamp(44px,13.5vw,150px);line-height:.92;font-weight:900;letter-spacing:.02em;text-transform:uppercase;background:linear-gradient(180deg,#fff 20%,#6fcfff 55%,#1479c9);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 26px rgba(30,167,255,.55));opacity:0;transform:translateY(40px) scale(.94);animation:rise 1.1s .2s cubic-bezier(.2,.8,.2,1) forwards}
.hero h1 span{display:block}
.tag{position:relative;margin-top:18px;color:var(--mut);letter-spacing:.3em;font-size:clamp(11px,3vw,15px);text-transform:uppercase;opacity:0;animation:rise 1s .6s forwards}
.cta{position:relative;margin-top:30px;display:flex;gap:12px;flex-wrap:wrap;justify-content:center;opacity:0;animation:rise 1s .9s forwards}
@keyframes rise{to{opacity:1;transform:none}}
.btn{display:inline-flex;align-items:center;gap:10px;padding:15px 26px;border-radius:999px;font-weight:700;font-size:15px;color:#fff;text-decoration:none;border:1px solid rgba(76,201,255,.5);background:rgba(30,167,255,.08);cursor:pointer;transition:.3s}
.btn:hover{background:rgba(30,167,255,.22);box-shadow:0 0 28px rgba(30,167,255,.5)}
.btn.yt{background:linear-gradient(135deg,#1ea7ff,#0a5fd6);border:0;box-shadow:0 0 30px rgba(30,167,255,.5);animation:pulse 2.4s infinite}
@keyframes pulse{50%{box-shadow:0 0 52px rgba(30,167,255,.85)}}
.scene{position:absolute;left:0;right:0;bottom:0;height:150px;overflow:hidden}
.scene .lane{position:absolute;left:0;right:0;bottom:22px;height:3px;background:repeating-linear-gradient(90deg,var(--blue) 0 38px,transparent 38px 90px);animation:lane 1s linear infinite;box-shadow:0 0 12px var(--blue)}
@keyframes lane{to{background-position:-90px 0}}
.scene .ground{position:absolute;left:0;right:0;bottom:0;height:46px;background:linear-gradient(#0c0f15,#05060a)}
.veh{position:absolute;bottom:30px;font-size:64px;filter:drop-shadow(0 0 16px rgba(30,167,255,.8));animation:cross 11s linear infinite}
.veh.b{font-size:84px;animation-duration:17s;animation-delay:-6s;bottom:34px}
@keyframes cross{from{left:-120px}to{left:calc(100% + 40px)}}
.scroll{position:absolute;bottom:160px;font-size:11px;letter-spacing:.3em;color:var(--mut);animation:bob 2s infinite}
@keyframes bob{50%{transform:translateY(8px)}}
section{padding:70px 18px;max-width:1180px;margin:0 auto}
h2{font-size:clamp(26px,6vw,44px);font-weight:800;letter-spacing:.03em;text-transform:uppercase}
h2 em{font-style:normal;color:var(--blue2);text-shadow:0 0 22px rgba(30,167,255,.7)}
.sub{color:var(--mut);margin:10px 0 26px;line-height:1.55}
.tabs{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 14px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:11px 20px;border-radius:999px;border:1px solid #232a38;background:var(--card);color:var(--mut);font-weight:600;font-size:14px;cursor:pointer;transition:.3s}
.tab.on{color:#fff;border-color:var(--blue);background:rgba(30,167,255,.16);box-shadow:0 0 22px rgba(30,167,255,.35)}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px;perspective:1100px}
.card{position:relative;border-radius:18px;background:var(--card);border:1px solid #1d2533;overflow:hidden;cursor:pointer;transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateZ(0);transition:transform .25s ease-out,box-shadow .3s,border-color .3s;animation:rise .7s both;transform-style:preserve-3d}
.card:hover{border-color:var(--blue);box-shadow:0 18px 50px rgba(30,167,255,.28)}
.thumb{aspect-ratio:16/9;display:grid;place-items:center;position:relative;background:radial-gradient(80% 90% at 30% 20%,rgba(30,167,255,.35),transparent 70%),linear-gradient(135deg,#171d29,#0a0d13);overflow:hidden}
.thumb:after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 40%,rgba(255,255,255,.12) 50%,transparent 60%);transform:translateX(-120%);transition:transform .8s}
.card:hover .thumb:after{transform:translateX(120%)}
.emo{font-size:52px;filter:drop-shadow(0 0 14px rgba(30,167,255,.7));transform:translateZ(40px) translate(calc(var(--ry,0deg)*-1),0)}
.play{position:absolute;right:12px;bottom:12px;width:42px;height:42px;border-radius:50%;background:var(--blue);display:grid;place-items:center;font-size:15px;box-shadow:0 0 20px var(--blue);transition:.3s}
.card:hover .play{transform:scale(1.18)}
.info{padding:14px 16px 18px}
.info small{color:var(--blue2);font-size:11px;letter-spacing:.2em;text-transform:uppercase}
.info p{margin-top:6px;font-weight:600;line-height:1.35}
.modal{position:fixed;inset:0;z-index:50;background:rgba(3,4,7,.88);backdrop-filter:blur(8px);display:grid;place-items:center;padding:16px;animation:fade .3s}
@keyframes fade{from{opacity:0}}
.mbox{width:min(920px,100%);background:var(--bg2);border:1px solid rgba(30,167,255,.4);border-radius:18px;padding:14px;box-shadow:0 0 60px rgba(30,167,255,.3);animation:pop .4s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{transform:scale(.88) translateY(20px);opacity:0}}
.frame{aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#000;display:grid;place-items:center;text-align:center;color:var(--mut);padding:16px}
.frame iframe{width:100%;height:100%;border:0}
.mrow{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}
.about{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.box{padding:22px;border-radius:16px;background:var(--card);border:1px solid #1d2533}
.box b{color:var(--blue2)}
footer{text-align:center;padding:40px 18px 50px;color:var(--mut);font-size:13px;border-top:1px solid #151b26}
.scn{position:relative;border-radius:24px;overflow:hidden;border:1px solid rgba(30,167,255,.25);background:radial-gradient(70% 90% at 80% 20%,rgba(30,167,255,.25),transparent 70%),linear-gradient(160deg,#10151e,#07090d);padding:34px 24px;min-height:320px;display:flex;flex-direction:column;justify-content:flex-end}
.scn.big{min-height:78svh;padding:40px 26px;margin-bottom:20px}
.scn .num{position:absolute;top:10px;right:18px;font-size:clamp(70px,20vw,190px);font-weight:900;color:transparent;-webkit-text-stroke:1px rgba(76,201,255,.35);line-height:1}
.big-e{position:absolute;top:16%;left:50%;font-size:clamp(100px,34vw,290px);transform:translateX(-50%);filter:drop-shadow(0 0 40px rgba(30,167,255,.8));animation:flt 5s ease-in-out infinite}
.sm .big-e{font-size:110px;top:12%}
@keyframes flt{50%{transform:translate(-50%,-14px) rotate(-2deg)}}
.scn h3{font-size:clamp(26px,7vw,54px);text-transform:uppercase;position:relative}
.scn p{color:var(--mut);margin:10px 0 18px;max-width:520px;line-height:1.55;position:relative}
.scn .btn{align-self:flex-start;position:relative}
.duo{display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.rv{opacity:0;transform:translateY(70px) scale(.95);filter:blur(10px);transition:opacity .9s,transform .9s cubic-bezier(.2,.8,.2,1),filter .9s}
.rv.in{opacity:1;transform:none;filter:none}
.prog{position:fixed;top:0;left:0;height:3px;width:calc(var(--p,0)*100%);background:var(--blue);box-shadow:0 0 12px var(--blue);z-index:60}
.chip{position:relative;margin-top:14px;padding:8px 16px;border:1px solid rgba(76,201,255,.4);border-radius:999px;font-size:13px;color:var(--blue2);background:rgba(30,167,255,.08);opacity:0;animation:rise 1s 1.1s forwards}
.poster{object-fit:cover;position:absolute;inset:0;width:100%;height:100%;border:0;pointer-events:none;background:#000}
.play{z-index:2}
.adm{position:fixed;left:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:70;padding:12px 18px;border-radius:999px;border:1px solid var(--blue);background:#0b1018;color:#fff;font-weight:700;cursor:pointer;box-shadow:0 0 20px rgba(30,167,255,.4)}
.pnl{position:fixed;inset:0;z-index:80;background:rgba(3,4,7,.94);overflow-y:auto;padding:18px}
.pnl .in{max-width:640px;margin:0 auto;display:grid;gap:10px}
.pnl input,.pnl textarea,.pnl select{width:100%;padding:12px;border-radius:10px;border:1px solid #2a3342;background:#0e1218;color:#fff;font:inherit}
.pnl h4{margin-top:14px;color:var(--blue2)}
.vrow{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:10px 12px;border:1px solid #1d2533;border-radius:10px;font-size:14px}
.vrow button{border:0;background:#2a1216;color:#ff8a8a;border-radius:8px;padding:8px 12px;cursor:pointer}
.pls{display:grid;gap:14px}
.pl{display:flex;align-items:center;gap:16px;padding:20px;border-radius:16px;background:var(--card);border:1px solid #1d2533;cursor:pointer;transition:.3s}
.pl:hover{border-color:var(--blue);box-shadow:0 0 30px rgba(30,167,255,.3);transform:translateX(6px)}
.pl.off{opacity:.55;cursor:default}
.pl .pn{font-size:32px;font-weight:900;color:transparent;-webkit-text-stroke:1px var(--blue2)}
.pl b{flex:1;font-size:18px}
.pl .go{color:var(--blue2);font-weight:700;font-size:13px}
a.card,a.pl{display:block;color:inherit;text-decoration:none}
a.pl{display:flex}

.scene .lane{animation:laneS 7s linear infinite}
@keyframes laneS{to{background-position:90px 0}}
.streaks{position:absolute;left:0;right:0;bottom:46px;height:104px;opacity:.75;background-image:linear-gradient(90deg,transparent,rgba(76,201,255,.6),transparent),linear-gradient(90deg,transparent,rgba(255,255,255,.4),transparent),linear-gradient(90deg,transparent,rgba(76,201,255,.5),transparent);background-size:260px 2px,410px 1px,330px 2px;background-repeat:repeat-x;background-position:0 18%,0 52%,0 82%;animation:streak 2.2s linear infinite;-webkit-mask-image:linear-gradient(90deg,transparent,#000 18%,#000 82%,transparent);mask-image:linear-gradient(90deg,transparent,#000 18%,#000 82%,transparent)}
@keyframes streak{to{background-position:1300px 18%,2050px 52%,1650px 82%}}
.chase{position:absolute;left:0;bottom:30px;display:flex;align-items:flex-end;gap:clamp(16px,4.5vw,46px);animation:chase 9s linear infinite;will-change:transform}
@keyframes chase{from{transform:translateX(100vw)}to{transform:translateX(-110%)}}
.chase img{display:block;position:relative;filter:drop-shadow(0 8px 12px rgba(30,167,255,.4))}
.chase .lg{width:clamp(54px,15vw,86px);border-radius:50%;filter:drop-shadow(0 0 16px rgba(30,167,255,.8));animation:lgb 1.2s ease-in-out infinite;margin-bottom:6px}
@keyframes lgb{50%{transform:translateY(-5px)}}
.chase .car{width:clamp(96px,27vw,170px);animation:lungeA 2.6s ease-in-out infinite alternate,bn .38s ease-in-out infinite alternate}
.chase .bus{width:clamp(150px,44vw,270px);animation:lungeB 3.2s ease-in-out infinite alternate,bn .46s ease-in-out infinite alternate}
@keyframes lungeA{from{left:0}to{left:-16px}}
@keyframes lungeB{from{left:-10px}to{left:8px}}
@keyframes bn{to{transform:translateY(-2px)}}

.sky{background:linear-gradient(#5f93ee,#78a7ff 35%,#a9c9ff 70%,#d3e5ff)}
.sun{position:absolute;top:11%;right:10%;width:clamp(54px,14vw,100px);aspect-ratio:1;background:#fff8c8;box-shadow:0 0 0 clamp(8px,2vw,14px) rgba(255,248,200,.35),0 0 90px 30px rgba(255,240,170,.55);pointer-events:none;transform:translate3d(calc(var(--mx,0)*-20px),calc(var(--y,0)*.3px),0)}

.ld{position:relative}

.ytx.go span{opacity:1}
.ytx em{display:block;height:3px;width:160px;margin:0 auto;background:linear-gradient(90deg,var(--blue),#fff);border-radius:3px;transform-origin:left;transform:scaleX(0);box-shadow:0 0 14px var(--blue)}
.ytx.go em{animation:ytb 1s .5s forwards}
@keyframes ytb{to{transform:scaleX(1)}}
.ytx.out{opacity:0}
@property --ang{syntax:"<angle>";initial-value:0deg;inherits:false}
a.card::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.5px;background:conic-gradient(from var(--ang),transparent 0 52%,rgba(30,167,255,.18) 64%,#1ea7ff 84%,#bfeaff 93%,transparent 100%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:cspin 6s linear infinite;pointer-events:none;z-index:3;opacity:.85;transition:opacity .3s}

.dh{margin:26px 0 12px;font-size:16px;letter-spacing:.08em;color:var(--blue2)}

.dl{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 20px;border-radius:14px;background:var(--card);border:1px solid #1d2533;color:#fff;text-decoration:none;transition:.3s}
.dl:hover{border-color:var(--blue);box-shadow:0 0 26px rgba(30,167,255,.3);transform:translateX(6px)}

html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}

.nav.show{transform:translate(-50%,0);opacity:1}
.nv{position:relative;display:flex;gap:4px;padding:6px;border-radius:999px;background:rgba(10,14,22,.65);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(76,201,255,.3);box-shadow:0 10px 40px rgba(0,0,0,.5),0 0 24px rgba(30,167,255,.2);overflow-x:auto;scrollbar-width:none}
.nv::-webkit-scrollbar{display:none}
.nv a{position:relative;z-index:1;flex:none;padding:10px 16px;border-radius:999px;color:#9fb3c9;text-decoration:none;font-weight:600;font-size:14px;transition:color .3s}
.nv a.on{color:#fff}
.nv .ind{position:absolute;top:6px;bottom:6px;left:0;border-radius:999px;background:linear-gradient(135deg,#1ea7ff,#0a5fd6);box-shadow:0 0 18px rgba(30,167,255,.7);transition:transform .45s cubic-bezier(.3,1.3,.5,1),width .45s;z-index:0}
.sweep{position:fixed;inset:0;z-index:150;pointer-events:none;background:linear-gradient(100deg,transparent 30%,rgba(30,167,255,.35) 50%,transparent 70%);transform:translateX(-100%)}
.sweep.run{animation:swp .7s ease-in-out}

.rv{transform:perspective(900px) rotateX(16deg) translateY(60px) scale(.96);transform-origin:50% 100%}
.card{animation:cardin .8s cubic-bezier(.2,.8,.2,1) backwards}

.st{position:relative;padding:22px 16px;text-align:center;border-radius:18px;background:var(--card);border:1px solid #1d2533;transition:.3s}

.btn{position:relative;overflow:hidden}
.btn::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.35) 50%,transparent 65%);transform:translateX(-120%);transition:transform .7s;pointer-events:none}

.dl.act,a.pl.act{border-color:var(--blue);box-shadow:0 0 30px rgba(30,167,255,.3);transform:translateX(6px)}

.ld{width:min(88vw,430px)}

@keyframes lti{to{opacity:1;transform:none}}

.prog{width:100%;transform:scaleX(0);transform-origin:left}

.cl1,.cl2,.cl3,.lcl{animation:none}

.hero h1 i{animation:lw 2.6s ease-in-out infinite}
.lt span{animation:lti .6s cubic-bezier(.2,.9,.3,1.3) forwards}
.nv{backdrop-filter:none;-webkit-backdrop-filter:none;background:rgba(10,14,22,.92)}

.rv,.rv.in{filter:none}

.hero.night .stars{opacity:1;animation:twk 3s ease-in-out infinite alternate}
.hero.night .stars.s2{animation-delay:1.2s}
@keyframes twk{from{opacity:.5}to{opacity:1}}
.hero.night .sun{background-color:#e6edf8;background-image:radial-gradient(circle at 30% 35%,rgba(150,165,190,.55) 0 12%,transparent 13%),radial-gradient(circle at 68% 62%,rgba(150,165,190,.5) 0 16%,transparent 17%),radial-gradient(circle at 60% 25%,rgba(150,165,190,.4) 0 8%,transparent 9%);box-shadow:0 0 0 clamp(8px,2vw,14px) rgba(200,220,255,.18),0 0 90px 24px rgba(150,190,255,.45)}
.hero.night .cl1{opacity:.14}
.hero.night .cl2{opacity:.2}
.hero.night .cl3{opacity:.28}
.cl1,.cl2,.cl3{transition:opacity .9s}
.hero.night .tag,.hero.night .scroll{color:#cfe0ff;text-shadow:none}
.hero.night .chip{background:rgba(255,255,255,.12);color:#cfe8ff;border-color:rgba(160,200,255,.5)}
.btn.ig{border:0;background:linear-gradient(135deg,#8a3ab9,#e1306c,#f7a23b);box-shadow:0 0 24px rgba(225,48,108,.4)}
.fl{color:var(--blue2);text-decoration:none;font-weight:700}
.sun .sh{position:absolute;top:calc(100% + 20px);right:-4px;white-space:nowrap;padding:7px 13px;border-radius:999px;background:rgba(10,25,55,.82);border:1px solid rgba(255,255,255,.6);color:#fff;font-size:12px;font-weight:700;letter-spacing:.02em;animation:shb 1.6s ease-in-out infinite}
.sun .sh::before{content:"";position:absolute;top:-6px;right:34px;width:10px;height:10px;background:inherit;border-left:1px solid rgba(255,255,255,.6);border-top:1px solid rgba(255,255,255,.6);transform:rotate(45deg)}
@keyframes shb{50%{transform:translateY(5px)}}
.hl,.tl{position:absolute;width:0;height:0;pointer-events:none}
.hl::before{content:"";position:absolute;left:-6px;top:-6px;width:12px;height:12px;border-radius:50%;background:#fff6c8;box-shadow:0 0 14px 6px rgba(255,244,190,.8);opacity:0;transition:opacity .8s}
.hl::after{content:"";position:absolute;right:0;top:-24px;width:clamp(110px,30vw,200px);height:48px;background:linear-gradient(270deg,rgba(255,244,190,.7),rgba(255,244,190,0));clip-path:polygon(100% 38%,0 0,0 100%,100% 62%);opacity:0;transition:opacity .8s}
.hl.big::after{width:clamp(130px,38vw,240px);height:58px;top:-29px}
.tl::before{content:"";position:absolute;left:-4px;top:-4px;width:8px;height:8px;border-radius:50%;background:#ff4a4a;box-shadow:0 0 12px 5px rgba(255,60,60,.7);opacity:0;transition:opacity .8s}
.hero.night .hl::before,.hero.night .hl::after,.hero.night .tl::before{opacity:1}
@media (hover:none){.card:hover{box-shadow:none}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important}}
.stmeta{grid-column:1/-1;text-align:center;font-size:.8rem;opacity:.7;letter-spacing:.03em}.stmeta.err{color:#ff8a8a;opacity:1}
.langsw{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);right:12px;z-index:9999;padding:8px 14px;border-radius:999px;border:1px solid rgba(76,201,255,.6);background:rgba(5,12,30,.75);color:#fff;font:700 13px/1 inherit;letter-spacing:.08em;cursor:pointer;backdrop-filter:blur(8px)}
.com{max-width:760px;margin:0 auto;padding:0 18px}
.cm-box{background:rgba(10,25,55,.55);border:1px solid rgba(76,201,255,.25);border-radius:18px;padding:20px;margin-top:22px;text-align:left}
.cm-box h3{margin:0 0 10px}.cm-q{font-size:1.1rem;margin:0 0 14px}
.cm-box input,.cm-box textarea{width:100%;box-sizing:border-box;padding:13px 14px;border-radius:12px;border:1px solid rgba(76,201,255,.3);background:rgba(0,0,0,.35);color:#fff;font:inherit;margin-bottom:10px}
.cm-opt{display:block;width:100%;text-align:left;padding:14px 16px;margin-bottom:10px;border-radius:12px;border:1px solid rgba(76,201,255,.4);background:rgba(30,167,255,.08);color:#fff;font:inherit;cursor:pointer}
.cm-opt:hover{background:rgba(30,167,255,.22)}
.cm-res{position:relative;display:flex;justify-content:space-between;padding:14px 16px;margin-bottom:10px;border-radius:12px;border:1px solid rgba(76,201,255,.25);overflow:hidden}
.cm-res i{position:absolute;inset:0 auto 0 0;background:rgba(30,167,255,.28);transition:width .8s}.cm-res.me{border-color:#4cc9ff}
.cm-res span,.cm-res b{position:relative}
.cm-s{display:block;opacity:.75;margin-top:8px}.cm-s.err{color:#ff8a8a;opacity:1}
.cm{border-top:1px solid rgba(255,255,255,.08);padding:12px 0}.cm b{color:#4cc9ff}.cm small{opacity:.6;margin-left:8px}.cm p{margin:6px 0 0;overflow-wrap:anywhere}
.intro{text-align:center;max-width:980px}
.intro h2{margin:0 0 18px;line-height:1.15}
.il{font-size:clamp(17px,4.6vw,21px);line-height:1.75;color:#f2f7ff;max-width:760px;margin:0 auto 30px}
.ig{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;text-align:left}
.ic{height:100%;box-sizing:border-box;background:rgba(10,25,55,.55);border:1px solid rgba(76,201,255,.3);border-radius:18px;padding:22px;box-shadow:0 0 30px rgba(30,167,255,.12)}
.ie{font-size:34px;display:block;margin-bottom:8px}

const { useState, useEffect, useRef } = React;
function Reveal({ children, d = 0, cls = "" }) {
  const r = useRef(null);
  useEffect(() => {
    const o = new IntersectionObserver(([e]) => { if (e.isIntersecting) { r.current.classList.add("in"); o.disconnect(); } }, { threshold: 0.15 });
    o.observe(r.current);
    return () => o.disconnect();
  }, []);
  return html`<div class=${"rv " + cls} ref=${r} style=${{ transitionDelay: d + "ms" }}>${children}</div>`;
}

function Card({ v, i, onOpen }) {
  const ref = useRef(null);
  const move = (e) => {
    const r = ref.current.getBoundingClientRect();
    const x = (e.clientX - r.left) / r.width - 0.5, y = (e.clientY - r.top) / r.height - 0.5;
    ref.current.style.setProperty("--ry", (x * 16).toFixed(1) + "deg");
    ref.current.style.setProperty("--rx", (-y * 16).toFixed(1) + "deg");
  };
  const reset = () => { ref.current.style.setProperty("--ry", "0deg"); ref.current.style.setProperty("--rx", "0deg"); };
  const c = CATS.find((c) => c.k === v.cat) || CATS[0];
  const ps = v.list ? "https://www.youtube-nocookie.com/embed/videoseries?list=" + v.list + "&controls=0&rel=0" : v.id ? "https://www.youtube-nocookie.com/embed/" + v.id + "?controls=0&rel=0&modestbranding=1&disablekb=1" : "";
  return html`<a class="card" href=${v.list ? "https://www.youtube.com/playlist?list=" + v.list : v.id ? "https://www.youtube.com/watch?v=" + v.id : CONFIG.channelUrl} target="_blank" rel="noopener" ref=${ref} style=${{ animationDelay: i * 80 + "ms" }} onPointerMove=${move} onPointerLeave=${reset} onPointerUp=${reset}>

}

function Modal({ v, onClose }) {
  useEffect(() => {
    const k = (e) => e.key === "Escape" && onClose();
    window.addEventListener("keydown", k);
    return () => window.removeEventListener("keydown", k);
  }, []);
  const link = v.list ? "https://www.youtube.com/playlist?list=" + v.list : v.id ? "https://www.youtube.com/watch?v=" + v.id : CONFIG.channelUrl;
  return html`<div class="modal" onClick=${onClose}>

    return () => clearTimeout(t);
  }, []);
  useEffect(() => {
    let raf;
    const sc = () => {
      cancelAnimationFrame(raf);
      raf = requestAnimationFrame(() => {
        const y = Math.min(window.scrollY, 900), h = heroRef.current;
        if (!h) return;
        h.style.setProperty("--y", y + "px");
        var pr = document.querySelector(".prog"); if (pr) pr.style.transform = "scaleX(" + (window.scrollY / Math.max(1, document.body.scrollHeight - window.innerHeight)).toFixed(3) + ")";
      });
    };
    window.addEventListener("scroll", sc, { passive: true });
    return () => window.removeEventListener("scroll", sc);
  }, []);
  const mm = (e) => {
    const h = heroRef.current, r = h.getBoundingClientRect();
    h.style.setProperty("--mx", ((e.clientX - r.left) / r.width - 0.5).toFixed(3));
    h.style.setProperty("--my", ((e.clientY - r.top) / r.height - 0.5).toFixed(3));
  };
  const qq = q.trim().toLocaleLowerCase("tr");
  const list = CONFIG.videos.filter((v) => (cat === "all" || v.cat === cat) && (!qq || (v.title || "").toLocaleLowerCase("tr").includes(qq)));
  const route = (s) => {
    const t = s.trim().toLocaleLowerCase("tr"), base = (CONFIG.channelUrl || "").replace(/\/$/, "");
    if (!t) return base + "/videos";
    const L2 = (p) => { const m = (p.url || "").match(/[?&]list=([\w-]+)/); return m ? "https://www.youtube.com/playlist?list=" + m[1] : null; };
    const pl = (CONFIG.playlists || []).find((p) => { const n = (p.name || "").toLocaleLowerCase("tr"); return L2(p) && n && (n.includes(t) || t.split(/\s+/).some((w) => w.length > 2 && n.includes(w))); });
    if (pl) return L2(pl);
    if (/otob|bus|proton|pbs/.test(t)) { const pp = (CONFIG.playlists || []).find((p) => /proton/i.test(p.name) && L2(p)); if (pp) return L2(pp); }
    return base + "/search?query=" + encodeURIComponent(s.trim());
  };
  const chanSearch = route(q);
  const L = (f, extra = "") => ({ transform: `translate3d(calc(var(--mx,0)*${f}px),calc(var(--y,0)*${f / 100}px + var(--my,0)*${f / 2}px),0)${extra}` });
  const scene = (c) => html`<${Reveal} cls=${c.big ? "" : ""} key=${c.k}><div class=${"scn " + (c.big ? "big" : "sm")}><span class="num">${c.n}</span><span class="big-e">${c.e}</span><h3>${c.t}</h3><p>${c.s}</p><button class="btn" onClick=${() => goCat(c.k, setCat)}>Videoları Gör →</button></div><//>`;
  return html`<div>
    <div class="prog"></div><${LangSwitch} /><${Nav} />
    <header class=${"hero" + (night ? " night" : "")} id="top" ref=${heroRef} onPointerMove=${mm}>
      <div class="layer sky"></div><div class="layer sky nt"></div><div class="stars"></div><div class="stars s2"></div><div class="sun" role="button" aria-label="Gece ve gündüz" onClick=${() => setNight((n) => !n)}><span class="sh">${night ? "☀️ Gündüz yap" : "🌙 Dokun: gece yap"}</span></div><div class="cl cl1"></div><div class="cl cl2"></div><div class="cl cl3"></div>
      
      <div style=${{ position: "relative", ...L(14, " rotateY(calc(var(--mx,0)*10deg)) rotateX(calc(var(--my,0)*-8deg))"), zIndex: 2 }}>
        <div class="kick">▶ SİMÜLASYON KANALI</div>
        <h1>${["Oyun", "Haritası"].map((w, j) => html`<span key=${w}>${w.split("").map((c, i) => html`<i key=${i} style=${{ animationDelay: (j * 0.5 + i * 0.09) + "s" }}>${c}</i>`)}</span>`)}</h1>
        <div class="uline"><b></b></div>
      </div>
      <p class="tag">${CONFIG.tagline}</p>
      <${SubChip} />
      <div class="cta">
        <a class="btn yt" href=${CONFIG.channelUrl} target="_blank" rel="noopener">▶ YouTube Kanalıma Git</a>
        <a class="btn" href="#videolar">Videolara Bak</a>
      </div>
      <div class="scroll">KAYDIR ↓</div>
      <div class="scene"><div class="streaks"></div><div class="ground"></div><div class="lane"></div><div class="chase"><img class="lg" src=${ART.logo} alt="Oyun Haritası" /><div class="car vh"><img src=${ART.car} alt="" /><img class="wh" style=${{ left: "14.00%", top: "58.80%", width: "13.67%" }} src=${ART.cw1} alt="" /><img class="wh" style=${{ left: "69.83%", top: "58.80%", width: "13.67%" }} src=${ART.cw2} alt="" /><i class="dg" style=${{ left: "20.83%", top: "90.40%" }}><b style=${{ "--d": "0s", "--x": "46px", "--y": "-12px" }}></b><b style=${{ "--d": "0.27s", "--x": "70px", "--y": "-20px" }}></b><b style=${{ "--d": "0.55s", "--x": "56px", "--y": "-8px" }}></b><b style=${{ "--d": "0.82s", "--x": "96px", "--y": "-26px" }}></b></i><i class="dg" style=${{ left: "76.67%", top: "90.40%" }}><b style=${{ "--d": "0s", "--x": "46px", "--y": "-12px" }}></b><b style=${{ "--d": "0.27s", "--x": "70px", "--y": "-20px" }}></b><b style=${{ "--d": "0.55s", "--x": "56px", "--y": "-8px" }}></b><b style=${{ "--d": "0.82s", "--x": "96px", "--y": "-26px" }}></b></i><i class="hl" style=${{ left: "6.67%", top: "53.60%" }}></i><i class="tl" style=${{ left: "92.67%", top: "43.20%" }}></i></div><div class="bus vh"><img src=${ART.bus} alt="" /><img class="wh" style=${{ left: "19.67%", top: "68.38%", width: "8.25%" }} src=${ART.bw1} alt="" /><img class="wh" style=${{ left: "67.74%", top: "68.38%", width: "8.25%" }} src=${ART.bw2} alt="" /><i class="dg" style=${{ left: "23.79%", top: "98.93%" }}><b style=${{ "--d": "0s", "--x": "46px", "--y": "-12px" }}></b><b style=${{ "--d": "0.27s", "--x": "70px", "--y": "-20px" }}></b><b style=${{ "--d": "0.55s", "--x": "56px", "--y": "-8px" }}></b><b style=${{ "--d": "0.82s", "--x": "96px", "--y": "-26px" }}></b></i><i class="dg" style=${{ left: "71.87%", top: "98.93%" }}><b style=${{ "--d": "0s", "--x": "46px", "--y": "-12px" }}></b><b style=${{ "--d": "0.27s", "--x": "70px", "--y": "-20px" }}></b><b style=${{ "--d": "0.55s", "--x": "56px", "--y": "-8px" }}></b><b style=${{ "--d": "0.82s", "--x": "96px", "--y": "-26px" }}></b></i><i class="tl" style=${{ left: "98.2%", top: "71%" }}></i><i class="hl big" style=${{ left: "0.67%", top: "81.41%" }}></i></div></div></div>
    </header>
    <${Intro} />
    <${Stats} />
    <section id="videolar">
      <h2>Video <em>Galerisi</em></h2>
      <p class="sub">Bir kategori seç, karta dokun, video YouTube'da açılsın.</p>
      <div class="srch"><input type="search" placeholder="Ara: otobüs, mod, Minecraft…" value=${q} onInput=${(e) => setQ(e.target.value)} onKeyDown=${(e) => { if (e.key === "Enter" && q.trim()) document.getElementById("srchgo").click(); }} /><a id="srchgo" class="btn yt" href=${chanSearch} target="_blank" rel="noopener">🔎 YouTube’da ara</a></div>
      <div class="tabs">${CATS.filter((c) => c.k === "all" || CONFIG.videos.some((v) => v.cat === c.k)).map((c) => html`<button key=${c.k} class=${"tab" + (cat === c.k ? " on" : "")} onClick=${() => setCat(c.k)}>${c.e} ${c.t}</button>`)}</div>
      <div class="gal" key=${cat}>${list.map((v, i) => html`<${Card} key=${cat + i} v=${v} i=${i} onOpen=${setOpen} />`)}</div>
      ${list.length ? null : html`<p class="sub">Bu aramayla sitede video yok. Enter’a basarsan YouTube’da aratabilirsin.</p>`}
    </section>
    <section id="indir">
      <h2>Mod ve Harita <em>İndir</em></h2>
      <p class="sub">Videolarda kullandığım harita ve araç modları.</p>
      ${[["Harita Modları", "🗺️", "map"], ["Araç Modları", "🚌", "car"]].map(([t, e, k]) => html`<div key=${k}><h3 class="dh">${e} ${t}</h3><div class="dls">${(CONFIG.downloads || []).filter((d) => d.cat === k).map((d, i) => html`<${Reveal} key=${i} d=${i * 100}><a class="dl" href=${d.url} target="_blank" rel="noopener"><b>${d.name}</b><span>⬇ İndir</span></a><//>`)}</div></div>`)}
    </section>
    <section id="hakkinda">
      <h2>Kanal <em>Hakkında</em></h2>
      <p class="sub">${CONFIG.about}</p>
      <div style=${{ marginTop: "30px", display: "flex", gap: "12px", flexWrap: "wrap", justifyContent: "center" }}><a class="btn yt" href=${CONFIG.channelUrl} target="_blank" rel="noopener">▶ Abone Ol</a><a class="btn ig" href=${CONFIG.instagram} target="_blank" rel="noopener">📷 Instagram</a></div>
    </section>
    <section id="listeler">
      <h2>Oynatma <em>Listeleri</em></h2>
      <p class="sub">Sırasıyla tüm listeler, hepsi elinin altında.</p>
      <div class="pls">${(CONFIG.playlists || []).map((p, i) => {
        const m = (p.url || "").match(/[?&]list=([\w-]+)/);
        return html`<${Reveal} key=${i} d=${i * 100}><a class=${"pl" + (m ? "" : " off")} href=${m ? "https://www.youtube.com/playlist?list=" + m[1] : undefined} target="_blank" rel="noopener"><span class="pn">${String(i + 1).padStart(2, "0")}</span><b>${p.name}</b><span class="go">${m ? "▶ İzle" : "Bağlantı yok"}</span></a><//>`;
      })}</div>
    </section>
    <${Community} />
    <footer><a class="fl" href=${CONFIG.instagram} target="_blank" rel="noopener">📷 @oyun_haritasii</a><br/>© ${CONFIG.channelName}</footer>
    ${open && html`<${Modal} v=${open} onClose=${() => setOpen(null)} />`}
    ${adm && html`<button class="adm" onClick=${() => setPnl(true)}>⚙️ Düzenle</button>`}
    ${pnl && html`<${Panel} db=${dbr.current} onClose=${() => setPnl(false)} />`}
  </div>`;
}
(function () { var io = new IntersectionObserver(function (es) { es.forEach(function (e) { e.target.classList.toggle("act", e.isIntersecting); }); }, { rootMargin: "-36% 0px -36% 0px" });
  setInterval(function () { document.querySelectorAll(".card:not([data-o]),.dl:not([data-o]),.pl:not([data-o]),.st:not([data-o])").forEach(function (el) { el.setAttribute("data-o", "1"); io.observe(el); }); }, 1500); })();
setTimeout(function () { var l = document.getElementById("loader"); if (l) { l.classList.add("off"); setTimeout(function () { l.remove(); }, 1200); } }, 3500);
document.addEventListener("click", function (e) {
  var a = e.target.closest && e.target.closest('a[href*="youtube.com"],a[href*="instagram.com"]');
  if (!a || a.dataset.raw || e.defaultPrevented) return;
  e.preventDefault();
  var href = a.href, x = e.clientX || innerWidth / 2, y = e.clientY || innerHeight / 2;
  var d = 2 * Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y));
  var o = document.createElement("div");
  o.className = "ytx";
  o.innerHTML = '<i style="left:' + x + 'px;top:' + y + 'px;width:' + d + 'px;height:' + d + 'px"></i><span>' + (href.indexOf("instagram") > -1 ? "Instagram" : "YouTube") + '’a geçiliyor…<em></em></span>';
  document.body.appendChild(o);
  requestAnimationFrame(function () { requestAnimationFrame(function () { o.classList.add("go"); }); });
  setTimeout(function () {
    var w = null;
    try { w = window.open(href, "_blank", "noopener"); } catch (_) {}
    if (!w) { var l = document.createElement("a"); l.href = href; l.target = "_blank"; l.rel = "noopener"; l.dataset.raw = "1"; document.body.appendChild(l); l.click(); l.remove(); }
    setTimeout(function () { o.classList.add("out"); setTimeout(function () { o.remove(); }, 600); }, 900);
  }, 750);
}, true);
ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);
</script>
</body>
